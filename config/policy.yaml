security_policy:
  sensitive_patterns:
    files:
      - ".ssh/"
      - ".aws/"
      - ".env"
      - "/etc/passwd"
      - "passwords.txt"
    commands:
      - "rm -rf"
      - "wget"
      - "| bash"

  suspicious_thresholds:
    max_requests_per_minute: 5
    max_dir_listings: 3

  allowed_domains:
    - "google.com"
    - "github.com"
